name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start a loopback OpenSSH server
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server ripgrep bubblewrap libseccomp2
          ssh_dir="$(mktemp -d "$HOME/dsh-ssh-test.XXXXXX")"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/host"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/client"
          printf '[127.0.0.1]:32222 %s\n' "$(cut -d ' ' -f 1,2 "$ssh_dir/host.pub")" > "$ssh_dir/known_hosts"
          cat > "$ssh_dir/server_config" <<EOF
          Port 32222
          ListenAddress 127.0.0.1
          HostKey $ssh_dir/host
          AuthorizedKeysFile $ssh_dir/client.pub
          PidFile $ssh_dir/sshd.pid
          AllowUsers $USER
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          EOF
          cat > "$ssh_dir/client_config" <<EOF
          Host dsh-loopback
            HostName 127.0.0.1
            Port 32222
            User $USER
            IdentityFile $ssh_dir/client
            UserKnownHostsFile $ssh_dir/known_hosts
          EOF
          sudo install -d /run/sshd
          sudo /usr/sbin/sshd -f "$ssh_dir/server_config" -E "$ssh_dir/sshd.log"
          ssh -F "$ssh_dir/client_config" -o BatchMode=yes -o StrictHostKeyChecking=yes dsh-loopback true || {
            sudo cat "$ssh_dir/sshd.log"
            exit 1
          }
          printf 'DSH_SSH_TEST_CONFIG=%s\n' "$ssh_dir/client_config" >> "$GITHUB_ENV"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --disable-userns --new-session --ro-bind / / -- /bin/true
          echo 'DSH_SSH_TEST_BWRAP=1' >> "$GITHUB_ENV"
      - run: npm test
